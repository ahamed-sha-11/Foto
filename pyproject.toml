[project]
name = "foto"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ahamed sha", email = "iahamedsha@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.142.2",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "imagekitio>=5.10.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
foto = "foto:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
